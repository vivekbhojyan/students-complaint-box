<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | ABES Engineering College</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    

<!-- HEADER -->
<header class="a">
    <div ><img src="download-removebg-preview.png" alt="ABES Logo"></div>
   <div class="b"> <h1 ><b>ABES ENGINEERING COLLEGE</b></h1></div>
   <div></div>
   <div></div>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <h1>Student/Admin Login</h1>
        <p>Login to access the complaint portal</p>
    </div>
</section>

<!-- LOGIN FORM -->
<main class="mainform">
    <h2 style="color: rgb(127,1,1); font-weight:bold;">Login</h2>
    <hr>

    <form onsubmit="return validateLoginForm()">

        <label>ID</label>
        <input type="text" id="loginAdmission" class="form-control"
               placeholder="Enter your University roll Number">
        <div class="error" id="loginAdmissionErr"></div>

        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control"
               placeholder="Enter your name">
        <div class="error" id="loginPasswordErr"></div>

        <br>
        <button type="submit" class="btn btn-danger btn-block" >
            Login
        </button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        Having any issue? <a href="contact.html">Contact us</a>
    </p>
</main>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
